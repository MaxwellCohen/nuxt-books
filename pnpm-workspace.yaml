allowBuilds:
  bufferutil: false
  esbuild: true
  sharp: true
  unrs-resolver: false
  utf-8-validate: false
# nuxt-nightly depends on @nuxt/cli-nightly@latest, which publishes several
# times a day and would otherwise fail pnpm's default 24h minimumReleaseAge
# check on CI (Vercel/Netlify/Cloudflare).
minimumReleaseAgeExclude:
  - nuxt-nightly
  - '@nuxt/*-nightly'
